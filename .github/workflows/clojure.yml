name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Install Clojure CLI
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: latest
    - name: Run JVM tests
      run: clojure -M:test
    - name: Run ClojureScript tests in headless Chrome
      run: >-
        clojure -M:cljs:dev:cljs-test
        -fwo '{:launch-js ["google-chrome" "--headless" "--disable-gpu" "--no-sandbox" "--user-data-dir=/tmp/kugelmass-cljs-tests" :open-url]}'
        -m kugelmass.test-runner
    - name: Build executable JAR
      run: clojure -T:build uber
